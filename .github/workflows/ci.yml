name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enso
          POSTGRES_PASSWORD: enso_ci
          POSTGRES_DB: enso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enso" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://enso:enso_ci@localhost:5432/enso_test
      TEST_DATABASE_URL: postgresql+psycopg://enso:enso_ci@localhost:5432/enso_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
