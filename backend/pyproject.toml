[project]
name = "enso-explorer-backend"
version = "1.0.0"
description = "API FastAPI et ETL pour explorer l'indice NOAA ONI (El Niño / La Niña)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert autorisé dans les tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
